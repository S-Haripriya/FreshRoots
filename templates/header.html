{% load static %}


<!-- ================= HEADER ================= -->

<header class="site-header">

    <nav class="navbar">

        <!-- Logo -->
        <div class="navbar-logo">

            <a href="{% url 'home' %}">
                <img src="{% static 'images/logo/freshroots-logo.png' %}"
                     alt="FreshRoots">
            </a>

        </div>


        <!-- Navigation Links -->
        <div class="navbar-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'about' %}">
                About
            </a>

            <a href="{% url 'browse_products' %}">
                Browse Products
            </a>


            {% if user.userprofile %}

                <a href="{% url 'view_cart' %}">
                    Cart
                </a>


                <!-- ================= FARMER DROPDOWN ================= -->

                {% if user.userprofile.is_verified_producer %}

                    <div class="navbar-dropdown">

                        <button type="button" class="navbar-dropdown-toggle">
                            My Business ▾
                        </button>

                        <div class="navbar-dropdown-menu">

                            <a href="{% url 'my_products' %}">
                                My Products
                            </a>

                            <a href="{% url 'farmer_orders' %}">
                                My Orders
                            </a>

                        </div>

                    </div>

                {% endif %}


                <a href="{% url 'profile' %}">
                    Profile
                </a>

            {% endif %}


            {% if user.delivery_partner_profile %}

                <a href="{% url 'delivery_dashboard' %}">
                    Delivery Dashboard
                </a>

            {% endif %}

        </div>


        <!-- Logout -->
        <div class="navbar-auth">

            <form action="{% url 'logout' %}" method="POST">

                {% csrf_token %}

                <button type="submit" class="logout-btn">
                    Logout
                </button>

            </form>

        </div>

    </nav>

</header>
