{% extends 'base.html' %}

{% block title %}FreshRoots | Page Not Found{% endblock %}

{% block content %}

<section style="padding: 100px 20px; text-align: center; min-height: 60vh;">

    <h1 style="font-size: 80px; color: #3f6f3f; margin-bottom: 10px;">404</h1>

    <h2 style="color: #244b27; margin-bottom: 15px;">Page Not Found</h2>

    <p style="color: #666; margin-bottom: 30px;">

    </a>

</section>

{% endblock %}
