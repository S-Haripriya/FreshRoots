{% load static %}


<!-- ================= HEADER ================= -->

<header class="site-header">

    <nav class="navbar">

        <!-- Logo -->
        <div class="navbar-logo">

            <a href="{% url 'home' %}">

                <img src="{% static 'images/logo/freshroots-logo.png' %}"
                     alt="FreshRoots">

            </a>

        </div>


        <!-- Navigation Links -->
        <div class="navbar-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'about' %}">
                About
            </a>

            <a href="{% url 'browse_products' %}">
                Browse Products
            </a>


            <!--
                Delivery partner accounts have no UserProfile,
                so only show Profile/My Products/My Orders
                when a UserProfile actually exists.
            -->

            {% if user.userprofile %}

                <a href="{% url 'profile' %}">
                    Profile
                </a>


                <!--
                    Display My Products / My Orders only when
                    the logged-in user is a verified producer.
                -->

                {% if user.userprofile.is_verified_producer %}

                    <a href="{% url 'my_products' %}">
                        My Products
                    </a>

                    <a href="{% url 'farmer_orders' %}">
                        My Orders
                    </a>

                {% endif %}

            {% endif %}


            <!--
                Delivery Dashboard link only for users who
                have a linked DeliveryPartner profile.
            -->

            {% if user.delivery_partner_profile %}

                <a href="{% url 'delivery_dashboard' %}">
                    Delivery Dashboard
                </a>

            {% endif %}

        </div>


        <!-- Logout -->
        <div class="navbar-auth">

            <form action="{% url 'logout' %}" method="POST">

                {% csrf_token %}

                <button type="submit" class="logout-btn">
                    Logout
                </button>

            </form>

        </div>

    </nav>

</header>
